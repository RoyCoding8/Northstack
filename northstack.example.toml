# --- Endpoint escape hatch --- optional fields for endpoints wrapping a protocol in own auth/versioning:
#   auth_header       raw header the resolved key is written to (default per protocol: Bearer / x-api-key / x-goog-api-key)
#   extra_headers     static per-request headers (credentials rejected; keys belong in api_key_env, redacted from logs)
#   extra_query       static query params appended to the request URL
#   token_limit_param openai_chat output-token param; OpenAI reasoning models need "max_completion_tokens" (default otherwise)
# Azure OpenAI: key in "api-key" header, deployment in path, api-version in query.
